<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Hub</title>
<meta name="theme-color" content="#0a0f1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon/icon-180.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><img src="icon/icon-192.png" alt=""></div><b id="ttl">QR Hub</b></div>
    <nav id="nav" aria-label="Chức năng"></nav>
    <div class="sync" id="sync" role="status"></div>
    <div class="foot"><b id="ftt">QR Hub</b></div>
  </aside>
  <main>
    <div id="lock" class="lockc card" hidden>
      <div class="lg"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <h4>Nhập khoá quản trị</h4>
      <p class="none" id="lockMsg">Dữ liệu được mã hoá. Cần ADMIN_KEY để mở.</p>
      <div class="inline"><input id="pIn" type="password" autocomplete="current-password" placeholder="ADMIN_KEY" aria-label="ADMIN_KEY"><button class="btn p" id="pOk" type="button">Mở khoá</button></div>
    </div>
    <div id="views" hidden></div>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="assets/app.js"></script>
<script src="assets/quicklinks.js" defer></script>
</body>
</html>
